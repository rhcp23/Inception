<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Right-click on each canvas and "Save image as..." with the specified filename</p>
    
    <div>
        <h2>icon-192.png (192x192)</h2>
        <canvas id="icon192" width="192" height="192"></canvas>
    </div>
    
    <div>
        <h2>icon-512.png (512x512)</h2>
        <canvas id="icon512" width="512" height="512"></canvas>
    </div>

    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            
            // Background with rounded corners
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size / 5);
            ctx.fill();
            
            // Checkmark
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size / 13;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(size * 0.3, size * 0.5);
            ctx.lineTo(size * 0.43, size * 0.63);
            ctx.lineTo(size * 0.72, size * 0.34);
            ctx.stroke();
        }
        
        drawIcon(document.getElementById('icon192'));
        drawIcon(document.getElementById('icon512'));
    </script>
</body>
</html>
