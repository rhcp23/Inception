<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="A hierarchical checklist PWA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Checklist">
    <title>Hierarchical Checklist</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="images/icon-192.png">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Inception</h1>
            <button id="homeBtn" class="home-btn" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
            </button>
        </header>

        <div class="breadcrumb" id="breadcrumb"></div>

        <main class="main-content">
            <div class="add-item-container">
                <input type="text" id="newItemInput" placeholder="Add a new item..." class="new-item-input">
                <button id="addItemBtn" class="add-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div id="checklistContainer" class="checklist-container"></div>
        </main>

        <div class="install-prompt" id="installPrompt" style="display: none;">
            <p>Install this app for quick access!</p>
            <button id="installBtn">Install</button>
            <button id="dismissBtn">Not now</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }
    </script>
</body>
</html>
